server:
  port: ${PORT:8080}
  # Detrás del proxy de Railway (TLS terminado fuera): respeta X-Forwarded-* para que
  # las URLs generadas (p. ej. el redirect_uri de OAuth2) usen https y el host público.
  forward-headers-strategy: framework
  # Gzip JSON responses (the library and stats lists); application/json is in the default mime types.
  compression:
    enabled: true
    min-response-size: 1KB
  # Sized for a small container: 30 request threads (default 200) is plenty for this traffic and
  # caps thread-stack memory; more threads than pool connections would only queue on the pool anyway.
  tomcat:
    threads:
      max: 30

spring:
  application:
    name: pytra-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${PGHOST:192.168.1.55}:${PGPORT:5432}/${POSTGRES_DB:pytra_db}
    username: ${POSTGRES_USER:pytra}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    # Small pool for a small container and a shared Postgres (Hikari's default keeps 10 open).
    # Hikari setters take milliseconds, so the timeouts are plain numbers, not Spring durations.
    hikari:
      # Fixed-size pool (minimum-idle = maximum-pool-size, as Hikari recommends). With fewer idle connections
      # the pool shrinks while the app is quiet, and the dashboard's ~11 parallel requests then wait for new
      # connections that Hikari opens one at a time (single "connection adder" thread). With a fixed pool
      # idle-timeout never applies, so it is not set.
      maximum-pool-size: 5
      minimum-idle: 5
      max-lifetime: 900000 # 15 min: recycle connections before any proxy/server idle cut
  jackson:
    deserialization:
      # Fail loudly (400) when a decimal is sent to an integer field instead of silently truncating it.
      accept-float-as-int: false
  jpa:
    # Kept on deliberately (set explicitly to silence the startup warning). Several write paths are not
    # @Transactional and rely on the request-scoped persistence context: e.g. GameServiceImpl.update maps the
    # entity it loaded after save(), and only because that instance stays managed does the response carry the
    # refreshed @UpdateTimestamp. Turning it off needs those services made transactional first.
    open-in-view: true
    hibernate:
      ddl-auto: validate #compara cada entidad contra la tabla real (nombres de columna, tipos, nulabilidad) y si algo no encaja, falla el arranque con un error explícito
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
steam:
  api-key: ${STEAM_API_KEY:}
# PSN service account (NPSSO cookie, 64 chars, valid ~2 months). Empty = PSN sync disabled (status configured=false).
psn:
  npsso: ${PSN_NPSSO:}
  scheduler:
    # Pause between two accounts in the scheduled sync (spreads requests of the shared service account).
    pause-between-accounts: ${PSN_SCHEDULER_PAUSE:3s}
app:
  # Users' time zone: calendar days of sync-written diary lines and of the activity streaks' "today".
  time-zone: ${APP_TIME_ZONE:Europe/Madrid}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  # Final redirect for login/link flows started from the Android app (custom scheme).
  mobile-redirect-uri: ${MOBILE_REDIRECT_URI:com.estebanmm13.pytra://oauth-callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost}
  # Invite-only registration: comma-separated emails allowed to create an account (password or Google).
  # Empty = registration open to everyone. Existing users can always sign in.
  registration:
    allowed-emails: ${ALLOWED_EMAILS:}
  # Public read-only demo: id of the account visitors browse via POST /api/v1/auth/demo. Empty = demo disabled.
  demo:
    user-id: ${DEMO_USER_ID:}
  # Single-owner avatar presets (AvatarPolicy.EXCLUSIVE_KEYS): comma-separated key:userId pairs, e.g.
  # "estebanexplorador:1". Bound by user id because usernames can be changed. Empty = nobody may pick them.
  avatars:
    exclusive-owners: ${EXCLUSIVE_AVATAR_OWNERS:}
  # IGDB metadata autofill (Twitch app credentials). Either blank = IGDB disabled (endpoints answer 404 IGDB_DISABLED).
  igdb:
    client-id: ${TWITCH_CLIENT_ID:}
    client-secret: ${TWITCH_CLIENT_SECRET:}
    # Background fill of the pending games Steam/PSN syncs create; only runs when IGDB is enabled.
    pending-enrichment:
      enabled: ${IGDB_PENDING_ENRICHMENT_ENABLED:true}
  # Abuse protection for the global platform catalog (POST /api/v1/platforms). Only real creations count;
  # create-if-missing hits on an existing entry are free. Window uses Spring duration syntax (1h, 30m, ...).
  platforms:
    max-total: ${PLATFORMS_MAX_TOTAL:200}
    create-rate-limit:
      max-per-window: ${PLATFORMS_CREATE_MAX_PER_WINDOW:20}
      window: ${PLATFORMS_CREATE_WINDOW:1h}
  # Transactional email via Brevo's HTTP API. With no API key, emails are only logged (local dev).
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:Pytra}
