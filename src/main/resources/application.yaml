server:
  port: ${PORT:8080}
  # Detrás del proxy de Railway (TLS terminado fuera): respeta X-Forwarded-* para que
  # las URLs generadas (p. ej. el redirect_uri de OAuth2) usen https y el host público.
  forward-headers-strategy: framework

spring:
  application:
    name: pytra-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${PGHOST:192.168.1.55}:${PGPORT:5432}/${POSTGRES_DB:pytra_db}
    username: ${POSTGRES_USER:pytra}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jackson:
    deserialization:
      # Fail loudly (400) when a decimal is sent to an integer field instead of silently truncating it.
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: validate #compara cada entidad contra la tabla real (nombres de columna, tipos, nulabilidad) y si algo no encaja, falla el arranque con un error explícito
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
steam:
  api-key: ${STEAM_API_KEY:}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
  # Final redirect for login/link flows started from the Android app (custom scheme).
  mobile-redirect-uri: ${MOBILE_REDIRECT_URI:com.estebanmm13.pytra://oauth-callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost}
  # Invite-only registration: comma-separated emails allowed to create an account (password or Google).
  # Empty = registration open to everyone. Existing users can always sign in.
  registration:
    allowed-emails: ${ALLOWED_EMAILS:}
  # Transactional email via Brevo's HTTP API. With no API key, emails are only logged (local dev).
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from-email: ${MAIL_FROM_EMAIL:}
    from-name: ${MAIL_FROM_NAME:Pytra}
