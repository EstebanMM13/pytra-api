server:
  port: ${PORT:8080}

spring:
  application:
    name: pytra-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${PGHOST:192.168.1.55}:${PGPORT:5432}/${POSTGRES_DB:pytra_db}
    username: ${POSTGRES_USER:pytra}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate #compara cada entidad contra la tabla real (nombres de columna, tipos, nulabilidad) y si algo no encaja, falla el arranque con un error explícito
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
steam:
  api-key: ${STEAM_API_KEY:}