spring:
  application:
    name: pytra-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://192.168.1.55:5432/${POSTGRES_DB:pytra_db}
    username: ${POSTGRES_USER:pytra}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate #compara cada entidad contra la tabla real (nombres de columna, tipos, nulabilidad) y si algo no encaja, falla el arranque con un error explícito