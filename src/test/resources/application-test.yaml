# Test profile: lets the full context boot without any real environment variable or .env file.
# The datasource itself comes from the Testcontainers @ServiceConnection (TestcontainersConfiguration).
spring:
  datasource:
    password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

# Read through @Value("${JWT_SECRET}") / @Value("${JWT_EXPIRATION}") in JwtService.
JWT_SECRET: cHl0cmEtaW50ZWdyYXRpb24tdGVzdHMtb25seS1qd3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbg==
JWT_EXPIRATION: 3600000

steam:
  api-key: ""

app:
  frontend-url: http://localhost:4200
  public-api-url: http://localhost:8080
  cors:
    allowed-origins: http://localhost:4200
  registration:
    # Empty = open registration, so tests never depend on an invite list.
    allowed-emails: ""
  mail:
    # No Brevo key: MailConfig falls back to LoggingEmailSender.
    brevo-api-key: ""
    from-email: ""
